name: Part data correction
description: Report a pinout, footprint, outline, or documentation problem
title: "[part data] "
labels:
  - part-data
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Schematic symbol
        - Footprint or pad geometry
        - Mechanical outline
        - Pinout
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is wrong and what you expected.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Supporting source
      description: Nordic document, drawing, design file, or measurement supporting the correction.
    validations:
      required: true
  - type: input
    id: kicad
    attributes:
      label: KiCad version

